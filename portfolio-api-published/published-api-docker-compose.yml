services:
  portfolio-api:
    build:
      context: .
      dockerfile: Portfolio.Api.Dockerfile
    image: portfolio-api:dev
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - ../.env
    environment:
      # ── Host ─────────────────────────────────────────────
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:5001;http://+:5000

      # ── HTTPS ────────────────────────────────────────────
      ASPNETCORE_Kestrel__Certificates__Default__Path: /app/${HTTPS_CERTIFICATE_PEM_PATH}
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /app/${HTTPS_CERTIFICATE_KEY_PATH}
      HTTPS_SSL_PROTOCOLS: ${HTTPS_SSL_PROTOCOLS}
      HTTPS_CLIENT_CERT_MODE: NoCertificate

      # ── AWS / LocalStack ────────────────────────────────
      AWS_DEFAULT_REGION: us-east-1
      Aws__ServiceUrl: http://ministack:4566
      HOME: /home/app

      # ── JWT (Section__Key, igual ao que o app lê) ───────
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    volumes:
      - ~/.aws:/home/app/.aws:ro
      - ../certs:/app/certs:ro
    networks:
      - portfolio-network
      - db-net

networks:
  portfolio-network:
    external: true
  db-net:
    external: true