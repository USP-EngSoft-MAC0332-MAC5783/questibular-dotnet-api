services:
  sonar-db-init:
    image: postgres:15-alpine
    container_name: sonar-db-init
    restart: "no"
    networks:
      - db-net
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGHOST: postgres
      PGPORT: 5432
      SONAR_DB: ${SONAR_DB:-sonar}
      SONAR_DB_USER: ${SONAR_DB_USER:-admin}
      SONAR_DB_PASSWORD: ${SONAR_DB_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Postgres..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" >/dev/null 2>&1; do
          sleep 2
        done

        echo "Ensuring database '$$SONAR_DB' exists..."
        EXISTS=$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$SONAR_DB'")
        if [ "$$EXISTS" != "1" ]; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$SONAR_DB\""
        fi

        echo "Ensuring role '$$SONAR_DB_USER' exists..."
        ROLE=$$(psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$SONAR_DB_USER'")
        if [ "$$ROLE" != "1" ]; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE USER \"$$SONAR_DB_USER\" WITH ENCRYPTED PASSWORD '$$SONAR_DB_PASSWORD'"
        fi

        echo "Granting privileges..."
        psql -d postgres -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE \"$$SONAR_DB\" TO \"$$SONAR_DB_USER\""
        psql -d "$$SONAR_DB" -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO \"$$SONAR_DB_USER\""
        psql -d "$$SONAR_DB" -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO \"$$SONAR_DB_USER\""

        echo "Sonar database ready."

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "3000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${SONAR_DB:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-admin}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-admin}
    depends_on:
      sonar-db-init:
        condition: service_completed_successfully
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - db-net

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  db-net:
    external: true