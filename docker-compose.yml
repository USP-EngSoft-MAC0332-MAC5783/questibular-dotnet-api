services:
  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: https://+:5001;http://+:5000
      AWS_DEFAULT_REGION: us-east-1
      Aws__ServiceUrl: http://ministack:4566
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ConnectionStrings__PostgresConnection: Host=postgres;Database=portfolio;Username=admin;Password=admin
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./certs:/app/certs:ro
    networks:
      - portfolio-network
      - db-net

networks:
  portfolio-network:
    external: true
  db-net:
    external: true