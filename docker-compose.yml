services:
  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: https://+:5001;http://+:5000
      ASPNETCORE_Kestrel__Certificates__Default__Path: /app/${HTTPS_CERTIFICATE_PEM_PATH}
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /app/${HTTPS_CERTIFICATE_KEY_PATH}
      HTTPS_CERTIFICATE_PEM_PATH: /app/${HTTPS_CERTIFICATE_PEM_PATH}
      HTTPS_CERTIFICATE_KEY_PATH: /app/${HTTPS_CERTIFICATE_KEY_PATH}
      HTTPS_SSL_PROTOCOLS: ${HTTPS_SSL_PROTOCOLS}
      HTTPS_CLIENT_CERT_MODE: ${HTTPS_CLIENT_CERT_MODE}

      AWS_DEFAULT_REGION: us-east-1
      Aws__ServiceUrl: http://ministack:4566
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./certs:/app/certs:ro
    networks:
      - portfolio-network
      - db-net

networks:
  portfolio-network:
    external: true
  db-net:
    external: true