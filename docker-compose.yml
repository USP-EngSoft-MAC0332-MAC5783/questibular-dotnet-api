services:
  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    environment:
      AWS_DEFAULT_REGION: us-east-1
      Aws__ServiceUrl: http://ministack:4566
      Jwt__Secret: ${JWT_SECRET}
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./certs:/app/certs:ro
    networks:
      - portfolio-network
    depends_on:
      ministack:
        condition: service_healthy

networks:
  portfolio-network:
    external: true